<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">Keep execution, visibility and delivery separate</title><desc id="desc">Concept diagram, not a screenshot or live trading result.</desc><rect width="760" height="490" rx="24" fill="#fffaf5"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="48" font-size="23" font-weight="700" fill="#244038">Keep execution, visibility and delivery separate</text><rect x="28" y="76" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="110" r="17" fill="#1765cf"/><text x="58" y="116" text-anchor="middle" fill="white" font-size="18">1</text><text x="90" y="112" font-size="21" font-weight="600" fill="#244038">Strategy enabled → eligible evaluation</text><text x="90" y="146" font-size="18" fill="#59685e">A timer tick or signal is not an exchange fill</text><path d="M380 178v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="192" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="226" r="17" fill="#1765cf"/><text x="58" y="232" text-anchor="middle" fill="white" font-size="18">2</text><text x="90" y="228" font-size="21" font-weight="600" fill="#244038">Exchange fill → recorded execution</text><text x="90" y="262" font-size="18" fill="#59685e">Reconcile partial fills before counting a full round</text><path d="M380 294v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="308" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="342" r="17" fill="#1765cf"/><text x="58" y="348" text-anchor="middle" fill="white" font-size="18">3</text><text x="90" y="344" font-size="21" font-weight="600" fill="#244038">Display switch / notification preferences</text><text x="90" y="378" font-size="18" fill="#59685e">Visibility is not trading; sending is not reading</text><text x="32" y="464" font-size="17" fill="#68766c">Concept diagram, not a screenshot or live trading result.</text></g></svg>