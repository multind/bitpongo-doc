<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">分清执行、展示与消息投递</title><desc id="desc">概念示意，不是界面截图或真实交易结果。</desc><rect width="760" height="490" rx="24" fill="#fffaf5"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="48" font-size="23" font-weight="700" fill="#244038">分清执行、展示与消息投递</text><rect x="28" y="76" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="110" r="17" fill="#1765cf"/><text x="58" y="116" text-anchor="middle" fill="white" font-size="18">1</text><text x="90" y="112" font-size="21" font-weight="600" fill="#244038">策略启用 → 满足条件后评估</text><text x="90" y="146" font-size="18" fill="#59685e">调度触发或产生信号，不等于交易所成交</text><path d="M380 178v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="192" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="226" r="17" fill="#1765cf"/><text x="58" y="232" text-anchor="middle" fill="white" font-size="18">2</text><text x="90" y="228" font-size="21" font-weight="600" fill="#244038">交易所成交 → 核对并记录</text><text x="90" y="262" font-size="18" fill="#59685e">部分成交需要核对，不能直接计作完整周期</text><path d="M380 294v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="308" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="342" r="17" fill="#1765cf"/><text x="58" y="348" text-anchor="middle" fill="white" font-size="18">3</text><text x="90" y="344" font-size="21" font-weight="600" fill="#244038">展示开关 / 通知偏好</text><text x="90" y="378" font-size="18" fill="#59685e">公开展示不是交易启停，发送成功不是用户已读</text><text x="32" y="464" font-size="17" fill="#68766c">概念示意，不是界面截图或真实交易结果。</text></g></svg>