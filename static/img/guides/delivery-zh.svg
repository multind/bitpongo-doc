<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">示例：按感知强度逐级推送</title><desc id="desc">流程示意；实际投递仍受网络和平台延迟影响。</desc><rect width="760" height="490" rx="24" fill="#fffaf5"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="48" font-size="23" font-weight="700" fill="#244038">示例：按感知强度逐级推送</text><rect x="28" y="76" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="110" r="17" fill="#1765cf"/><text x="58" y="116" text-anchor="middle" fill="white" font-size="18">1</text><text x="90" y="112" font-size="21" font-weight="600" fill="#244038">第一组：邮件（弱）</text><text x="90" y="146" font-size="18" fill="#59685e">相同强度的可用渠道组成同一组</text><path d="M380 178v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="192" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="226" r="17" fill="#1765cf"/><text x="58" y="232" text-anchor="middle" fill="white" font-size="18">2</text><text x="90" y="228" font-size="21" font-weight="600" fill="#244038">五分钟未确认 → Webhook</text><text x="90" y="262" font-size="18" fill="#59685e">再过五分钟未确认 → 下一更强的组</text><path d="M380 294v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="308" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="342" r="17" fill="#1765cf"/><text x="58" y="348" text-anchor="middle" fill="white" font-size="18">3</text><text x="90" y="344" font-size="21" font-weight="600" fill="#244038">明确确认后停止后续升级</text><text x="90" y="378" font-size="18" fill="#59685e">打开 App 或标记已读，不等于确认</text><text x="32" y="464" font-size="17" fill="#68766c">流程示意；实际投递仍受网络和平台延迟影响。</text></g></svg>