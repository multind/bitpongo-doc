<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">F&amp;G：相对盈利回撤与完整交易周期</title><desc id="desc">规则示意；止盈目标或止损可能先触发。</desc><rect width="760" height="490" rx="24" fill="#fffaf5"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="48" font-size="23" font-weight="700" fill="#244038">F&amp;G：相对盈利回撤与完整交易周期</text><rect x="28" y="76" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="110" r="17" fill="#1765cf"/><text x="58" y="116" text-anchor="middle" fill="white" font-size="18">1</text><text x="90" y="112" font-size="21" font-weight="600" fill="#244038">最高浮盈率 20%</text><text x="90" y="146" font-size="18" fill="#59685e">回撤设置：浮盈的 5%</text><path d="M380 178v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="192" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="226" r="17" fill="#1765cf"/><text x="58" y="232" text-anchor="middle" fill="white" font-size="18">2</text><text x="90" y="228" font-size="21" font-weight="600" fill="#244038">回撤阈值：20% × 0.95 = 19%</text><text x="90" y="262" font-size="18" fill="#59685e">不是 15%：相对比例与百分点不同</text><path d="M380 294v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="308" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="342" r="17" fill="#1765cf"/><text x="58" y="348" text-anchor="middle" fill="white" font-size="18">3</text><text x="90" y="344" font-size="21" font-weight="600" fill="#244038">开仓 → 持仓 → 平仓 → 核对实际成交</text><text x="90" y="378" font-size="18" fill="#59685e">完成整轮平仓后才增加已完成轮数</text><text x="32" y="464" font-size="17" fill="#68766c">规则示意；止盈目标或止损可能先触发。</text></g></svg>