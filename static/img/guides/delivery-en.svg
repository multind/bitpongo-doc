<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">Example: escalation by strength</title><desc id="desc">Illustration only. Provider/network delays still apply.</desc><rect width="760" height="490" rx="24" fill="#fffaf5"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="32" y="48" font-size="23" font-weight="700" fill="#244038">Example: escalation by strength</text><rect x="28" y="76" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="110" r="17" fill="#1765cf"/><text x="58" y="116" text-anchor="middle" fill="white" font-size="18">1</text><text x="90" y="112" font-size="21" font-weight="600" fill="#244038">First wave: email (Weak)</text><text x="90" y="146" font-size="18" fill="#59685e">Same-strength eligible channels share one wave</text><path d="M380 178v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="192" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="226" r="17" fill="#1765cf"/><text x="58" y="232" text-anchor="middle" fill="white" font-size="18">2</text><text x="90" y="228" font-size="21" font-weight="600" fill="#244038">No confirmation for 5 min → Webhook</text><text x="90" y="262" font-size="18" fill="#59685e">Then another 5 min → the next stronger wave</text><path d="M380 294v12m-5-5 5 5 5-5" stroke="#1765cf" fill="none" stroke-width="2"/><rect x="28" y="308" width="704" height="94" rx="16" fill="#fff" stroke="#dce6e0"/><circle cx="58" cy="342" r="17" fill="#1765cf"/><text x="58" y="348" text-anchor="middle" fill="white" font-size="18">3</text><text x="90" y="344" font-size="21" font-weight="600" fill="#244038">Explicit confirmation stops later waves</text><text x="90" y="378" font-size="18" fill="#59685e">Opening the App or reading is not confirmation</text><text x="32" y="464" font-size="17" fill="#68766c">Illustration only. Provider/network delays still apply.</text></g></svg>